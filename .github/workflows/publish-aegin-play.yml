name: Publish Aegin to Google Play

on:
  push:
    tags:
      - 'aegin-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Google Play release status'
        required: true
        default: 'DRAFT'
        type: choice
        options:
          - DRAFT
          - COMPLETED
          - IN_PROGRESS
      version_code:
        description: 'Override Android versionCode (optional; defaults to GitHub run_number)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Override Android versionName (optional; defaults to tag or 1.0.<run_number>)'
        required: false
        default: ''
        type: string

jobs:
  publish-play:
    name: Build & Publish Aegin AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Validate Play & Signing Secrets
        env:
          KEYSTORE_B64: ${{ secrets.AEGIN_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.AEGIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AEGIN_KEY_ALIAS }}
          KEY_PW: ${{ secrets.AEGIN_KEY_PASSWORD }}
          PLAY_SA_JSON: ${{ secrets.AEGIN_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for var in KEYSTORE_B64 KEYSTORE_PW KEY_ALIAS KEY_PW PLAY_SA_JSON; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub secret for $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Decode Release Keystore & Play Service Account
        env:
          KEYSTORE_B64: ${{ secrets.AEGIN_KEYSTORE_BASE64 }}
          PLAY_SA_JSON: ${{ secrets.AEGIN_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/aegin-release.jks"
          printf '%s' "$PLAY_SA_JSON" > "${{ runner.temp }}/play-service-account.json"

      - name: Resolve Version Metadata
        id: version
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            VC="${{ inputs.version_code }}"
          else
            VC="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            VN="${{ inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/aegin-v* ]]; then
            VN="${GITHUB_REF#refs/tags/aegin-v}"
          else
            VN="1.0.${{ github.run_number }}"
          fi

          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "Resolved Aegin versionName=$VN, versionCode=$VC"

      - name: Build Signed AAB & Publish to Google Play
        env:
          AEGIN_KEYSTORE_FILE: ${{ runner.temp }}/aegin-release.jks
          AEGIN_KEYSTORE_PASSWORD: ${{ secrets.AEGIN_KEYSTORE_PASSWORD }}
          AEGIN_KEY_ALIAS: ${{ secrets.AEGIN_KEY_ALIAS }}
          AEGIN_KEY_PASSWORD: ${{ secrets.AEGIN_KEY_PASSWORD }}
          AEGIN_PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          AEGIN_PLAY_TRACK: ${{ inputs.track || 'internal' }}
          AEGIN_PLAY_RELEASE_STATUS: ${{ inputs.release_status || 'DRAFT' }}
          AEGIN_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AEGIN_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew :apps:Aegin:publishReleaseBundle --no-daemon --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegin-release-aab-${{ steps.version.outputs.version_name }}
          path: apps/Aegin/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Clean Up Temporary Credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/aegin-release.jks" "${{ runner.temp }}/play-service-account.json"
